[workspace]
resolver = "2"
members = [
    "crates/ontology-core",
    "crates/ontology-rdf",
    "crates/ontology-owl",
    "crates/ontology-skos",
    "crates/ontology-classify",
    "crates/ontology-embedding",
    "crates/ontology-inference",
    "crates/ontology-import",
    "crates/ontology-application",
    "crates/ontology-api",
    "crates/ontology-cli",
    "crates/ontology-mcp",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
# Serialization / errors
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"

# Identifiers and time
ulid = { version = "1.2", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

# IRI handling
oxiri = "0.3"

# Hashing (stable statement identifiers)
sha2 = "0.10"

# Async boundary for application services
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
toml = "0.8"

# RDF storage: the internal Oxigraph engine, linked against the system RocksDB
# through pkg-config (`rocksdb-pkg-config`), matching the setup used by
# ~/Scripts/rust_extract. `rocksdb` enables the persistent storage backend.
oxigraph = { git = "https://github.com/mfrager/oxigraph", branch = "basenote", default-features = false, features = [
    "rocksdb",
    "rocksdb-pkg-config",
] }

# Internal crates
ontology-core = { path = "crates/ontology-core" }
ontology-rdf = { path = "crates/ontology-rdf" }
ontology-owl = { path = "crates/ontology-owl" }
ontology-skos = { path = "crates/ontology-skos" }
ontology-classify = { path = "crates/ontology-classify" }
ontology-embedding = { path = "crates/ontology-embedding" }
ontology-inference = { path = "crates/ontology-inference" }
ontology-import = { path = "crates/ontology-import" }
ontology-application = { path = "crates/ontology-application" }
ontology-api = { path = "crates/ontology-api" }
ontology-cli = { path = "crates/ontology-cli" }
ontology-mcp = { path = "crates/ontology-mcp" }

# Dev / test helpers
tempfile = "3"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
    "net",
    "signal",
    "io-std",
    "io-util",
] }

# HTTP server and client
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.9", features = ["transport-io", "client", "transport-child-process"] }
shlex = "1.3"
criterion = "0.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[profile.release]
lto = "thin"
